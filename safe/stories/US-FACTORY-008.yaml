id: US-FACTORY-008

title: "Provide a pinned Flutter + Android SDK build toolchain for the factory"

# SAFe Enabler Story (factory tooling, not product scope). Prerequisite of the
# Android part of US-002 (RAID D-008). Drafted by CLAUDE_BA 2026-10-08 on human PO
# instruction: "giao Codex DevOps cài Android SDK và Flutter".
#
# Decisions approved by the human PO on 2026-10-08:
#   AD-03: Flutter and the Android SDK are provided ONLY through a pinned Docker
#     image (same model as AD-01 for Python). Codex local runs and Jenkins use the
#     same image. Nothing is installed on the EC2 host.
#   Versions: latest Flutter stable at implementation time, then pinned exactly
#     (Flutter version + image digest recorded in the repo). Android platform
#     android-35 (Android 15); minSdk 35 because the app supports Android 15+ only
#     (D23); compileSdk/targetSdk >= 35. JDK 17 inside the image.
#   Android SDK License: accepted by the human PO (RAID D-009). The image build may
#     accept the licenses non-interactively; the accepted license files are not
#     edited by hand.
#   Verification model (human PO 2026-10-08, because of RAID I-016 on the host: the
#     Codex sandbox has no Docker access and the runtime guard covers only the Python
#     gates): Codex DevOps writes the Dockerfile, wrapper, smoke-test script and docs
#     inside its sandbox and does not run Docker. A human runs TS01-TS10 on the host
#     with the committed files; those results are recorded as HUMAN, never as
#     CODEX_DEVOPS. No permission is widened.
#
# Renumbered 2026-10-08 (human PO): drafted and merged as US-FACTORY-004 (PR #12), but
# that ID is already used on the unmerged branch management/factory-v2-stabilization
# (Lean MVF Story). Same for I-014 -> I-021 and R-007 -> R-008. Content unchanged.
