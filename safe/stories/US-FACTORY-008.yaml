privacy_impact: false

test_scenarios:
  - id: TS01
    covers: [AC01, AC02]
    scenario: "Build the image from a clean cache. Every FROM line uses a digest, and Flutter, build-tools and platform versions are fixed values in the repo, not 'latest'."
  - id: TS02
    covers: [AC04]
    scenario: "Wrapper runs `flutter doctor -v`: Flutter OK, Android toolchain OK, licenses accepted. The output is saved as evidence."
  - id: TS03
    covers: [AC05, AC06]
    scenario: "Smoke test: `flutter create` in a temporary directory, set minSdk 35, `flutter build apk --debug` -> exit 0. `aapt dump badging` (or apkanalyzer) shows minSdkVersion 35. Record build time and peak memory."
  - id: TS04
    covers: [AC03]
    scenario: "Docker stopped or unreachable -> wrapper exits non-zero with a message naming Docker."
  - id: TS05
    covers: [AC03, AC02]
    scenario: "Image reference set to an unknown digest -> wrapper exits non-zero naming the image; it does not use a host toolchain."
  - id: TS06
    covers: [AC03]
    scenario: "Wrapper runs `false` -> exits 1; runs `true` -> exits 0 (exit code passed through)."
  - id: TS07
    covers: [AC03, AC07]
    scenario: "Run TS02 with no flutter, java or sdkmanager on the host PATH -> same result. `which flutter sdkmanager adb` on the host stays empty after the Story."
  - id: TS08
    covers: [AC07]
    scenario: "git diff of the Story branch shows no change to Jenkinsfile, scripts/build.sh, lint.sh, unit-test.sh, deploy.sh or validate-story.sh."
  - id: TS09
    covers: [FR03]
    scenario: "After the smoke test, no file in the mounted directory is owned by root."
  - id: TS10
    covers: [AC08]
    scenario: "A reviewer follows the documentation on a fresh shell and reproduces TS02."

