non_functional_requirements: []

dependencies: []

components: {backend: false, frontend: false, android: false, ios: false, infrastructure: true}
api_impact: false
ui_impact: false
data_impact: false
security_impact: true
privacy_impact: false

test_scenarios:
  - id: TS01
    covers: [AC02]
    scenario: "Read-only GitHub API check of protection and merge settings matches REPOSITORY-SETTINGS.md section 8."
  - id: TS02
    covers: [AC04]
    scenario: "ssh -T -o BatchMode=yes git@github.com from the host does not authenticate as sonld1505."
  - id: TS03
    covers: [AC03]
    scenario: "A PR without the passing Jenkins check cannot be merged (after D-001)."
  - id: TS04
    covers: [AC01]
    scenario: "PR template contains every decision-package field."

