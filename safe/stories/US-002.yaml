test_scenarios:
  - id: TS01
    covers: [AC01]
    type: measurement
    scenario: "Phát 1 giờ âm nền TV/hội thoại có chứa 'cô ơi' trong ngữ cảnh khác → đếm kích hoạt nhầm."
  - id: TS02
    covers: [AC01, AC02]
    type: measurement
    scenario: "Phát tập ghi âm MOCK (người lớn + giọng tổng hợp) nói từng lệnh → tỷ lệ nhận đúng từ gọi và intent."
  - id: TS03
    covers: [AC03]
    type: measurement
    scenario: "Đang phát TTS 10 giây, nói 'Cô ơi, dừng' → đo ms tới khi dừng, 20 lần mỗi máy."
  - id: TS04
    covers: [AC04]
    type: measurement
    scenario: "Bắt gói mạng 10 phút im lặng và 10 lệnh → chỉ 10 đoạn audio được gửi."
  - id: TS06
    covers: [AC06]
    type: measurement
    scenario: "Gửi 200 đoạn lệnh có nhãn tới Viettel AI; đọc 30 câu mẫu chứa biểu thức (3x + 5 = 20, 25/3) bằng Azure → shadow teacher chấm cách đọc."
  - id: TS05
    covers: [AC05]
    type: measurement
    scenario: "Báo cáo có bảng license và chi phí cho phương án được khuyến nghị."

open_questions:
  - "Q1: Cách chốt danh sách máy đã có (tiêu chí tối thiểu + test thật); vẫn cần đội mobile đề xuất tiêu chí và máy cụ thể cho spike."
  - "Q2 (đã trả lời 08/10): tuần 1 dùng ghi âm người lớn + giọng tổng hợp; ghi âm trẻ để sau (RAID I-013)."
  - "Q3 (đã trả lời 08/10): cổng S = nhận đúng 'Cô ơi' ≥ 80% và kích hoạt nhầm ≤ 3 lần/giờ trên mỗi nền tảng."
  - "Q4: Spike cần kỹ sư mobile thật trên iPhone; Codex Android/iOS có máy thử không?"

