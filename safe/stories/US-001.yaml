id: US-001

title: "Spike: model vision đọc bài làm và đề in Toán lớp 6 (cổng S)"

story_type: enabler
depends_on: []

epic: "EPIC-007"
feature: "F-021"

status: DRAFT
blocked_from: null
blocked_by: []
priority: high
story_points: null

business_context: >
  Toàn bộ sản phẩm dựa trên giả thuyết model vision thương mại đọc đủ đúng chữ viết tay
  của trẻ lớp 6 và đề in lớp 6 (Business HLD v1.3 §11.1, cổng S; Technical HLD v1.3 §6, §12, §13 tuần 1).
  Đây là spike đo lường, không phải tính năng.

business_value: >
  Quyết định có đi tiếp vertical slice tuần 2–5 hay không. Nếu không đạt thì phải đổi hướng
  trước khi tốn công xây app.

description: >
  Chạy claude-opus-5-5, claude-sonnet-5-5 và claude-haiku-5-5 (Anthropic, PO chốt 08/10) qua một adapter
  thử nghiệm trên hai tập: (a) 100–200 ảnh bài làm của trẻ lớp 6 trong vở, có số câu ở lề trái, chụp từ giá đỡ;
  (b) 20–30 tờ đề in Toán 6 HK1 Cánh diều một trang (có ý con, có câu hình học). Mọi ảnh qua bước ẩn danh hóa
  (Technical HLD v1.3 §5.7) trước khi gửi Anthropic. Đo thêm khả năng đọc số câu ở lề trái vở.
  Đo theo metrics Technical HLD §12 và báo theo model_version/prompt_version. Không xây pipeline sản phẩm.

acceptance_criteria:
  - id: AC01
    description: "Báo cáo spike có, cho từng model: exact-match transcription theo dòng, lỗi dấu âm/phân số, tỷ lệ token không chắc, latency p50/p95, chi phí ước tính trên mỗi ảnh (ghi rõ là ước tính và nguồn đơn giá)."
  - id: AC02
    description: "Trên tập đề in: tỷ lệ đủ câu/ý và đúng nội dung đề (text/công thức thiết yếu) so với nhãn tay; câu hình/bảng được gắn cờ, không biến thành text đầy đủ."
  - id: AC03
    description: "Prompt nhận dạng chỉ yêu cầu chép lại; mẫu kiểm 'trẻ viết 2 + 3 = 6' được giữ nguyên là 6 (A12)."
  - id: AC04
    description: "Output có cấu trúc câu/ý/dòng, LaTeX, độ tin cậy, cách đọc thay thế cho token không chắc (Technical HLD §6.2)."
  - id: AC05
    description: "Kết luận đạt/không đạt cổng S theo ngưỡng PO chốt 08/10: model tốt nhất có kết luận lỗi đúng ≥ 75% trên bài làm và đủ câu/ý đề in ≥ 95% trước xác nhận."
  - id: AC06
    description: "Không ảnh, nhãn, secret hay output thô nào của trẻ được commit vào Git; dữ liệu nằm ở nơi lưu trữ được PO duyệt."
  - id: AC07
    description: "Mọi request gửi Anthropic trong spike không có EXIF, mã người dùng/học sinh/phiên/thiết bị; dải đầu trang bị che (A43). Báo cáo ghi kích thước dải che đề xuất."
  - id: AC08
    description: "Báo cáo tỷ lệ đọc đúng số câu ở lề trái vở cho từng model."

functional_requirements:
  - "FR01: Adapter thử nghiệm gọi được từng model ứng viên với cùng prompt và cùng ảnh."
  - "FR02: Bộ nhãn tay (giáo viên) cho từng dòng bài làm và từng câu/ý của đề."
  - "FR03: Script tính metrics, chạy lại được, ghi model_version và prompt_version."

non_functional_requirements:
  - "NFR01: Chỉ dùng provider đã được PO duyệt sau khi xác minh điều khoản cho trẻ em (CLAUDE_AI_Tutor.md §10)."
  - "NFR02: Ảnh chỉ là vùng giấy đã cắt; không có khuôn mặt hoặc người trong ảnh."
  - "NFR03: Mọi số liệu trong báo cáo là số đo trên tập spike, ghi rõ cỡ mẫu; không ngoại suy thành accuracy sản phẩm."

dependencies:
  - "Q2: Provider vision được duyệt (A+)."
  - "Q3: Nguồn và đồng ý cho ảnh bài làm của trẻ."
  - "Shadow teacher gán nhãn (Business HLD v1.3 D25)."

components:
  backend: true
  frontend: false
  android: false
  ios: false
  infrastructure: false

api_impact: false
ui_impact: false
data_impact: true
security_impact: true
privacy_impact: true

test_scenarios:
  - id: TS01
    covers: [AC01, AC04]
    type: measurement
    scenario: "Chạy script metrics trên 5 ảnh mẫu có nhãn → báo cáo có đủ cột cho mỗi model."
  - id: TS02
    covers: [AC02]
    type: measurement
    scenario: "Đề 2 trang 5 câu 8 ý, có một câu hình vẽ → 8 item, câu hình vẽ có cờ."
  - id: TS03
    covers: [AC03]
    type: measurement
    scenario: "Ảnh bài làm '2 + 3 = 6' → transcription giữ 6."
  - id: TS04
    covers: [AC05]
    type: measurement
    scenario: "Báo cáo đối chiếu từng chỉ số với ngưỡng PO đã chốt; ghi PASS/FAIL/UNKNOWN."
  - id: TS05
    covers: [AC06]
    type: measurement
    scenario: "Quét repo sau spike: không có file ảnh, nhãn hay output thô của trẻ; không có secret."
  - id: TS06
    covers: [AC07]
    type: security
    scenario: "Chặn và lưu payload gửi Anthropic của 20 request → kiểm không có EXIF, không có trường định danh, dải đầu trang đã che."
  - id: TS07
    covers: [AC08]
    type: measurement
    scenario: "Trang vở có 1), 3), 4) → so số câu model đọc với nhãn tay."

open_questions:
  - "Q1 (đã trả lời 08/10): ngưỡng cổng S = kết luận lỗi đúng ≥ 75% trên bài làm; đủ câu/ý đề in ≥ 95% trước xác nhận (BH §0.4)."
  - "Q5: Phạm vi là toàn bộ Toán lớp 6 HK1; cần bộ SGK và danh sách dạng bài HK1 để dựng tập mẫu có độ phủ đủ."
  - "Q2: Provider đã chốt là Anthropic; còn phải xác minh điều khoản cho người dưới 18 tuổi, retention, training, vị trí xử lý (inference_geo) trước khi gửi ảnh thật. Việc A+, cần PO duyệt."
  - "Q6: Tập mẫu theo SGK Cánh diều HK1, gồm hình học; vở có số câu ở lề trái (ví dụ '1) 5x + 3 = 28')."
  - "Q3: Ảnh bài làm lấy từ đâu, đồng ý loại 2 hay thỏa thuận riêng, lưu ở đâu, xóa khi nào?"
  - "Q4: Ai chạy spike: Codex Backend hay kỹ sư AI của đội?"
  - "Q7: Shadow teacher gán nhãn tập spike (D25); cần ký hợp tác trước 14/10."

