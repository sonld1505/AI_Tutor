# RAID register — owner: SCRUM_MASTER. Template: safe/templates/raid.yaml
risks:
  - id: R-001
    description: "scripts/validate-story.sh passes a Story whose definition_of_ready block is empty or missing keys (DEF-001). Until fixed, a non-ready Story can get a worktree."
    probability: null
    impact: null
    mitigation: "Scrum Master checks every DoR key manually against safe/templates/definition-of-ready.yaml before setting READY. Fix tracked in DEF-001."
    owner: "CLAUDE_SM"
    status: OPEN
  - id: R-002
    description: "Nothing enforces BLOCKED or depends_on: validate-story.sh exits 0 for US-FACTORY-001 (status BLOCKED, depends_on US-FACTORY-002 not DONE; checked 2026-10-03). Once US-FACTORY-002 widens the worktree ID pattern, create-worktree.sh could give US-FACTORY-001 a worktree before US-FACTORY-002 is DONE. DEF-001 AC06 (status must be REFINED/READY) would close this, but DEF-001 has no owning Story (I-004)."
    probability: null
    impact: null
    mitigation: "Scrum Master does not request a worktree for a BLOCKED Story and checks depends_on by hand before moving US-FACTORY-001 out of BLOCKED."
    owner: "CLAUDE_SM"
    status: OPEN
  - id: R-003
    description: "PO widened MVP content from 2–3 problem types to all of Grade 6 Math semester 1 (2026-10-08). More types means more labelled replay data, validator rules and hint templates before G0 (2026-11-11); BH §11 fallback was to narrow to one type if G0 slips."
    probability: null
    impact: null
    update_2026_10_08: "PO also includes HK1 geometry (hình học trực quan). Geometry answers involve drawings and measurements that SymPy line-by-line checking does not cover; TH v1.2 has no design for verifying drawn figures. Needs a Technical HLD addition before F-010 can be refined."
    update_2026_10_08_v13: "Geometry grading moved after pilot (D30); geometry items stay UNSUPPORTED and the validator registry (TH v1.3 §8.5) keeps the extension point. Remaining risk: all arithmetic/algebra topics of HK1 before G0."
    mitigation: "Order HK1 topics by frequency in real teacher worksheets from the week-1 spike; PO decides a G0 subset if the slice slips."
    owner: "HUMAN_PO"
    status: OPEN
  - id: R-004
    description: "One shadow teacher must review every AI response in the pilot (D25). At 50 families the queue may exceed capacity, and images expire after 7 days (D20), so some responses could be reviewed without the image."
    probability: null
    impact: null
    mitigation: "Measure review load in alpha (week 6); queue prioritises low confidence and near-expiry items (TH v1.3 §8.11); PO decides on extra reviewers before G2."
    owner: "HUMAN_PO"
    status: OPEN
  - id: R-006
    description: "Week-1 spikes run on MOCK data (adult handwriting, synthetic child-like voices). Adult handwriting is usually neater than a Grade 6 child's and synthetic voices differ from real children, so gate S (MOCK) may overstate accuracy for vision, wake word and ASR."
    probability: null
    impact: null
    mitigation: "Label every result MOCK; include deliberately messy pages and fast/quiet speakers in the mock sets; re-measure on consented real child data before G1 (2026-11-18) and treat a drop below the S thresholds as a stop signal."
    owner: "HUMAN_PO"
    status: OPEN
  - id: R-005
    description: "Masking the header band (D26) does not guarantee that names written elsewhere on a notebook page are removed before images reach Anthropic."
    probability: null
    impact: null
    mitigation: "Measure in spike US-001 (AC07); shadow teacher labels 'contains identifying data' (A46) and each label is a safety incident."
    owner: "HUMAN_PO"
    status: OPEN
  - id: R-008
    description: "The factory EC2 has 2 vCPU and 7 GB RAM. Gradle + Flutter Android builds in a container (US-FACTORY-008) may be slow or run out of memory, and they compete with Jenkins and Codex runs on the same host."
    probability: null
    impact: null
    mitigation: "US-FACTORY-008 AC06 fixes Gradle memory explicitly and records build time and peak memory; if the smoke build does not fit, the PO decides on a larger instance or a separate build host."
    owner: "HUMAN_PO"
    status: OPEN

