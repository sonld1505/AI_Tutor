    probability: null
    impact: null
    mitigation: "Scrum Master does not request a worktree for a BLOCKED Story and checks depends_on by hand before moving US-FACTORY-001 out of BLOCKED."
    owner: "CLAUDE_SM"
    status: OPEN
  - id: R-003
    description: >
      The PO human merge/release gate is not technically enforced. Checked 2026-10-04: GitHub
      reports develop and main as not protected (unauthenticated REST read), and the EC2 host's
      default SSH key authenticates as the PO login sonld1505 (used for management pushes, e.g.
      dbe7278..b779eef). Any Factory process with access to that key could push or merge into
      develop/main as the PO, bypassing review and the human gate. Repository merge-method settings
      (squash/rebase) are not verifiable without a token (UNVERIFIED).
    probability: null
    impact: null
    mitigation: "Human/admin: apply docs/factory/REPOSITORY-SETTINGS.md (merge commits only, protection incl. admins, required review, later required Jenkins check); identities follow D-006 (PO decision 2026-10-04, D-006 authoritative and not amended): implementation commits use the bot identity sonldfkr2911, management commits use sonld1505 (an earlier text here said all Factory commits use the bot; superseded, see RAID I-017 on management/US-FACTORY-003-recovery-status); the PO key is taken out of unattended use from unattended use on the host. Until then agents must not push to develop/main (convention only). US-FACTORY-007 Q4 / AC15."
    owner: "HUMAN_PO"
    status: OPEN
  - id: R-004
    description: "Platform feasibility of V2 engineering roles on the current host (G-19, G-20, G-21): iOS needs macOS/Xcode (host is Linux); Android emulator tests unrealistic on t3.large without KVM; AI/ML has no permitted provider for children and no evaluation datasets."
    probability: null
    impact: null
    mitigation: "SA ADRs during US-FACTORY-005 refinement (runner/device-farm/unit-only); macOS runner or device farm cost is a PO decision (E5); provider verification by PO (CLAUDE_AI_Tutor.md §10)."
    owner: "CLAUDE_SA (interim) / HUMAN_PO"
    status: OPEN
  - id: R-005
    description: "Single EC2 host holds Jenkins, Docker, all agent worktrees and (planned) the 006 runtime state store; no backup; management work may be committed but unpushed (G-26)."
    probability: null
    impact: null
    mitigation: "Push management work after each phase (identity per G-14); host backup/snapshot policy (PO, cost); 006 design keeps authoritative state in Git."
    owner: "HUMAN_PO"
    status: OPEN
  - id: R-006
    description: "Human separation of duties: sonld1505 is PO, the only AC13 reviewer and approver, and was the identity used for Claude management commits (G-23)."
    probability: null
    impact: null
    mitigation: "Management identity (REPOSITORY-SETTINGS.md §3); keep Factory identities off the approver list; consider a second human reviewer."
    owner: "HUMAN_PO"
    status: OPEN

